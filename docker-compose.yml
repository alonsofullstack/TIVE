services:
  tive-bot:
    build: .
    container_name: tive-bot
    restart: always
    env_file:
      - .env
    volumes:
      # Rutas de producción por defecto (tu setup original). Sobrescribir en .env si hace falta.
      - ${CERTIFICADOS_VOLUME:-/root/backups_sunarp/certificados}:/app/servicio/verCertificado
      - ${LOGS_VOLUME:-/root/backups_sunarp/logs}:/app/logs
    environment:
      - NODE_ENV=production